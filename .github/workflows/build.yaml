name: Build FakeClock IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (Release, unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project FakeClock.xcodeproj \
            -scheme FakeClock \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Assemble IPA
        run: |
          set -euo pipefail
          APP=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          test -x "$APP/FakeClock"
          rm -rf Payload FakeClock.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          codesign --force --deep --sign - Payload/FakeClock.app || echo "ad-hoc codesign skipped"
          zip -qry FakeClock.ipa Payload
          ls -lh FakeClock.ipa

      - name: Validate IPA
        run: |
          set -euo pipefail
          unzip -l FakeClock.ipa | grep -q 'Payload/FakeClock.app/Info.plist'
          unzip -l FakeClock.ipa | grep -q 'Payload/FakeClock.app/FakeClock'
          rm -rf _check && mkdir _check && unzip -q FakeClock.ipa -d _check
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' _check/Payload/FakeClock.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' _check/Payload/FakeClock.app/Info.plist
          plutil -lint _check/Payload/FakeClock.app/Info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FakeClock-IPA
          path: FakeClock.ipa
